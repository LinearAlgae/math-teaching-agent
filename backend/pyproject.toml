[project]
name = "math-teaching-agent-backend"
version = "0.1.0"
description = "Backend API for Math Teaching Chat Application with NHM pedagogy"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pytesseract>=0.3.10",
    "python-multipart>=0.0.9",
    "pydantic>=2.0.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = [
    "N815",  # mixedCase in Pydantic models (needed for JSON serialization)
    "UP042",  # str, Enum instead of StrEnum (Pydantic compatibility)
]

[tool.ruff.lint.per-file-ignores]
"src/services/pedagogy.py" = ["E501"]  # System prompt string literals

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
